appId: com.meccain.ping
tags:
  - smoke
---
# Flow: Home screen — verifies balance display and token list after sign-in.
# Inlines login steps to avoid runFlow + clearState gRPC driver disconnect issue.

- launchApp:
    clearState: true

- tapOn:
    text: "Login"

- extendedWaitUntil:
    visible:
      text: "Enter Email Address"
    timeout: 10000

- tapOn:
    text: "Enter Email Address"
- inputText: ${TEST_EMAIL}

- tapOn:
    text: "Enter Password"
- inputText: ${TEST_PASSWORD}

- hideKeyboard

- tapOn:
    text: "Sign In"
    index: 1

# Wait for Home screen
- extendedWaitUntil:
    visible:
      text: "Receive"
    timeout: 15000

# The total asset value is shown with a "$" prefix in the hero section
- assertVisible:
    text: "$"

# "Native" is the section header above the free-balance token list
- assertVisible:
    text: "Native"

# Quick-action "Receive" button is always visible regardless of feature flags
- assertVisible:
    text: "Receive"
