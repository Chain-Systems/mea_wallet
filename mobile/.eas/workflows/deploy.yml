name: Deploy

"on":
  workflow_dispatch: {}
  push:
    branches:
      - release
    paths:
      - mobile/**

jobs:
  build_android:
    name: Build Android
    type: build
    environment: production
    params:
      platform: android
      profile: production

  build_ios:
    name: Build iOS
    type: build
    environment: production
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Submit iOS
    needs: [build_ios]
    type: submit
    environment: production
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production

  notify_android_success:
    name: Notify Android Success
    needs: [build_android]
    if: ${{ success() }}
    environment: production
    steps:
      - uses: eas/send_slack_message
        with:
          slack_hook_url: ${{ env.SLACK_HOOK_URL_SUCCESS }}
          message: |
            Android production build completed.

            Workflow: ${{ workflow.name }}
            Details: ${{ workflow.url }}

  notify_android_failure:
    name: Notify Android Failure
    after: [build_android]
    if: ${{ failure() }}
    environment: production
    steps:
      - uses: eas/send_slack_message
        with:
          slack_hook_url: ${{ env.SLACK_HOOK_URL_FAILURE }}
          message: |
            Android production build failed.

            Workflow: ${{ workflow.name }}
            Details: ${{ workflow.url }}

  notify_ios_success:
    name: Notify iOS Success
    needs: [submit_ios]
    if: ${{ success() }}
    environment: production
    steps:
      - uses: eas/send_slack_message
        with:
          slack_hook_url: ${{ env.SLACK_HOOK_URL_SUCCESS }}
          message: |
            iOS production deployment completed.

            Workflow: ${{ workflow.name }}
            Details: ${{ workflow.url }}

  notify_ios_failure:
    name: Notify iOS Failure
    after: [build_ios, submit_ios]
    if: ${{ failure() }}
    environment: production
    steps:
      - uses: eas/send_slack_message
        with:
          slack_hook_url: ${{ env.SLACK_HOOK_URL_FAILURE }}
          message: |
            iOS production deployment failed.

            Workflow: ${{ workflow.name }}
            Details: ${{ workflow.url }}
