name: Release

# Promotes main → preview AND main → release. Optionally bumps the app version
# first (auto = patch only when main and release are on the same version), opens
# a promotion PR for each branch, and — when auto_merge is on — waits for the
# required checks (typecheck, i18n) to pass and then merges each PR directly.
# Merging into `preview` triggers the EAS preview workflow; merging into
# `release` triggers the EAS deploy workflow.
#
# Note: this merges manually (`gh pr merge`, no `--auto`) so it does NOT require
# the repo-level "Allow auto-merge" setting (enablePullRequestAutoMerge).

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump for this release"
        required: true
        default: "auto"
        type: choice
        options:
          - auto # patch ONLY if main version == release version, else no bump
          - none # release as-is, never bump
          - patch
          - minor
          - major
      auto_merge:
        description: "Wait for checks and merge the preview + release PRs (off = just open them)"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Promote main → release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve bump level
        id: level
        run: |
          set -euo pipefail
          MAIN_VER=$(node -p "require('./mobile/package.json').version || ''")
          git fetch origin release --depth=1
          # Read release version via a temp file (robust — no piped stdin to node -p)
          git show origin/release:mobile/package.json > /tmp/release-package.json
          RELEASE_VER=$(node -p "require('/tmp/release-package.json').version || ''")

          if [ -z "$MAIN_VER" ] || [ "$MAIN_VER" = "undefined" ]; then
            echo "::error::could not read version from mobile/package.json on main"; exit 1
          fi
          if [ -z "$RELEASE_VER" ] || [ "$RELEASE_VER" = "undefined" ]; then
            echo "::error::could not read version from mobile/package.json on release"; exit 1
          fi

          INPUT="${{ inputs.bump }}"
          if [ "$INPUT" = "auto" ]; then
            if [ "$MAIN_VER" = "$RELEASE_VER" ]; then LEVEL="patch"; else LEVEL="none"; fi
          else
            LEVEL="$INPUT"
          fi

          echo "main_ver=$MAIN_VER"       >> "$GITHUB_OUTPUT"
          echo "release_ver=$RELEASE_VER" >> "$GITHUB_OUTPUT"
          echo "level=$LEVEL"             >> "$GITHUB_OUTPUT"
          echo "::notice::main=$MAIN_VER release=$RELEASE_VER → bump=$LEVEL"

      - name: Bump version on main
        id: bump
        if: steps.level.outputs.level != 'none'
        working-directory: mobile
        env:
          OLD: ${{ steps.level.outputs.main_ver }}
          LEVEL: ${{ steps.level.outputs.level }}
        run: |
          set -euo pipefail
          NEW=$(npx --yes semver "$OLD" -i "$LEVEL")
          if [ -z "$NEW" ]; then
            echo "::error::semver produced an empty version from OLD=$OLD LEVEL=$LEVEL"; exit 1
          fi
          export NEW
          node -e "
            const fs = require('fs');
            ['package.json', 'app.json'].forEach((f) => {
              const raw = fs.readFileSync(f, 'utf8');
              fs.writeFileSync(
                f,
                raw.replace(/\"version\": \"[^\"]+\"/, '\"version\": \"' + process.env.NEW + '\"')
              );
            });
          "
          echo "new=$NEW" >> "$GITHUB_OUTPUT"

      - name: Commit and push bump to main
        if: steps.level.outputs.level != 'none'
        env:
          OLD: ${{ steps.level.outputs.main_ver }}
          LEVEL: ${{ steps.level.outputs.level }}
          NEW: ${{ steps.bump.outputs.new }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mobile/package.json mobile/app.json
          git commit -m "chore(release): bump $LEVEL version $OLD → $NEW"
          git push origin HEAD:main

      - name: Determine release version
        id: ver
        run: |
          if [ "${{ steps.level.outputs.level }}" = "none" ]; then
            echo "version=${{ steps.level.outputs.main_ver }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ steps.bump.outputs.new }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Promote main → preview and release
        # For each target branch: open (or reuse) a main → <branch> PR, then —
        # when auto_merge is on — wait for required checks and merge it directly.
        # No `--auto`, so the repo-level auto-merge feature is not needed.
        timeout-minutes: 90
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          AUTO_MERGE: ${{ inputs.auto_merge }}
        run: |
          set -euo pipefail
          git fetch origin main preview release

          for BRANCH in preview release; do
            echo "::group::Promote main → $BRANCH"

            # Nothing to promote if the branch is already level with main.
            AHEAD=$(git rev-list --count "origin/$BRANCH..origin/main")
            if [ "$AHEAD" = "0" ]; then
              echo "::notice::$BRANCH is already up to date with main — skipping"
              echo "::endgroup::"
              continue
            fi

            # Reuse an open main → <branch> PR if one already exists.
            URL=$(gh pr list --base "$BRANCH" --head main --state open \
              --json url --jq '.[0].url // ""')
            if [ -n "$URL" ]; then
              echo "Reusing existing PR: $URL"
            else
              URL=$(gh pr create \
                --base "$BRANCH" \
                --head main \
                --title "release v$VERSION → $BRANCH" \
                --body "Automated promotion of \`v$VERSION\` (main → $BRANCH). Merging triggers the EAS workflow for \`$BRANCH\`.")
            fi
            echo "::notice::$BRANCH PR: $URL"

            if [ "$AUTO_MERGE" = "true" ]; then
              # Give GitHub a moment to register the PR's checks, then block
              # until they finish. --watch exits non-zero if any check fails,
              # which fails this step before we ever reach the merge.
              sleep 15
              gh pr checks "$URL" --watch --interval 15
              gh pr merge "$URL" --merge
              echo "::notice::Merged $BRANCH PR"
            else
              echo "::notice::auto_merge disabled — leaving $BRANCH PR open"
            fi

            echo "::endgroup::"
          done
