name: i18n Key Check

on:
  push:
    branches: [main, preview, release]
    paths:
      - mobile/locales/**
  pull_request:
    paths:
      - mobile/locales/**

jobs:
  validate:
    name: All locale keys present and non-empty
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate translation keys
        run: node .github/scripts/check-i18n.js
